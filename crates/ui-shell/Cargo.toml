[package]
name = "fansipan-shell"
version = "0.0.1"
edition.workspace = true
license.workspace = true
# Only the contract crates go to crates.io (docs/roadmap.md, Phase 2);
# adapters take this one from the same core source as their contract.
publish = false
description = "Fansipan desktop shell: wires the bus, engines, and an adapter to a Tauri window."

[dependencies]
model.workspace = true
bus.workspace = true
data-engine.workspace = true
execution-engine.workspace = true
journal.workspace = true
adapter-api.workspace = true
sandbox.workspace = true
tauri = { version = "2", features = [] }
tauri-plugin-window-state = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
proptest.workspace = true
