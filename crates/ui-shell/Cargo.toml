[package]
name = "ui-shell"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Desktop shell: wires the bus, engines, and a simulated adapter to a Tauri window."

[dependencies]
model = { path = "../model" }
bus = { path = "../bus" }
data-engine = { path = "../data-engine" }
execution-engine = { path = "../execution-engine" }
adapter-api = { path = "../adapter-api" }
sandbox = { path = "../adapters/sandbox" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
