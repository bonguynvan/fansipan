[package]
name = "fansipan-shell"
version = "0.0.1"
edition.workspace = true
license.workspace = true
description = "Fansipan desktop shell: wires the bus, engines, and an adapter to a Tauri window."

[dependencies]
model.workspace = true
bus.workspace = true
data-engine.workspace = true
execution-engine.workspace = true
adapter-api.workspace = true
sandbox.workspace = true
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }

[build-dependencies]
tauri-build = { version = "2", features = [] }
