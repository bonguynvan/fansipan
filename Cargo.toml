[workspace]
resolver = "2"
members = [
  "crates/model",
  "crates/bus",
  "crates/adapter-api",
  "crates/data-engine",
  "crates/execution-engine",
  "crates/adapters/sandbox",
  "crates/ui-shell",
]

[workspace.package]
edition = "2021"
license = "LGPL-3.0-or-later"

# Published names carry the `fansipan-` prefix; inside the workspace each
# crate is imported by its short name (`model`, `bus`, `adapter_api`, ...).
# The contract crates also carry their version: crates.io needs it to
# publish a crate that depends on them, and it must move with each release.
[workspace.dependencies]
model = { package = "fansipan-model", version = "0.2.2", path = "crates/model" }
bus = { package = "fansipan-bus", version = "0.2.2", path = "crates/bus" }
adapter-api = { package = "fansipan-adapter-api", version = "0.2.2", path = "crates/adapter-api" }
data-engine = { package = "fansipan-data-engine", path = "crates/data-engine" }
execution-engine = { package = "fansipan-execution-engine", path = "crates/execution-engine" }
sandbox = { package = "fansipan-sandbox", path = "crates/adapters/sandbox" }
# Property tests (dev-dependency only). Without default features: no
# process forking or timeouts, which these pure, fast tests do not need.
proptest = { version = "1.11", default-features = false, features = ["std"] }
