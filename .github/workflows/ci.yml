# Every push: formatting, workspace membership, licences and advisories once,
# then the front end and the Rust workspace on Linux and Windows. macOS joins
# weekly and on demand, as its minutes cost ten times as much on a private
# repository. What this runs is what CLAUDE.md asks before every commit.
#
# Actions are pinned to a commit, with the release in a comment, so a moved
# tag cannot change what runs here.

name: CI

# Branches pushed here run CI; while the repository is private there are no
# forks. Add a pull_request trigger when it goes public, so forks get CI too.
on:
  push:
  workflow_dispatch:
  schedule:
    - cron: "23 2 * * 1"

permissions:
  contents: read

# A newer push supersedes a branch's run, but every run on main finishes:
# main's runs are the ones that save the build cache.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always
  # Keep these in step with the Dockerfile.
  NODE_VERSION: "22"
  PNPM_VERSION: "10.15.0"
  FRONTEND: crates/ui-shell/frontend

jobs:
  rules:
    name: Format, workspace, licences
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The version rust-toolchain.toml pins, with clippy and rustfmt.
      - name: Rust
        run: rustup toolchain install
      - name: Formatting
        run: cargo fmt --all --check
      - name: Every crate is a workspace member
        run: python3 scripts/check-workspace.py
      # Reads the advisory database as it is today, so a newly published
      # advisory can turn this red with no change here. That is the point.
      - name: Licences, advisories, sources
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          arguments: --all-features --locked

  build:
    name: Build and test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON((github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '["ubuntu-latest","windows-latest","macos-latest"]' || '["ubuntu-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Tauri's Linux prerequisites, as in the Dockerfile.
      - name: System libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: ${{ env.PNPM_VERSION }}
          cache: true
          cache_dependency_path: ${{ env.FRONTEND }}/pnpm-lock.yaml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          package-manager-cache: false
      - name: Front-end dependencies
        working-directory: ${{ env.FRONTEND }}
        run: pnpm install --frozen-lockfile
      # The front end's checks do not depend on the platform; run them once.
      - name: Front-end types and markup
        if: runner.os == 'Linux'
        working-directory: ${{ env.FRONTEND }}
        run: pnpm run check --fail-on-warnings
      - name: Front-end tests (UI rules included)
        if: runner.os == 'Linux'
        working-directory: ${{ env.FRONTEND }}
        run: pnpm test
      # The shell embeds the built front end, so it must exist before Rust builds.
      - name: Front-end build
        working-directory: ${{ env.FRONTEND }}
        run: pnpm build

      # The version rust-toolchain.toml pins, with clippy and rustfmt.
      - name: Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          # Only main's cache is kept, so branches reuse it without filling the quota.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Tests
        run: cargo test --workspace --locked

  # The quote path's latency distribution (docs/performance.md), weekly and on
  # demand. A shared runner is too noisy for a tight gate, so the numbers go
  # in the run's summary and only budgets on medians, about a hundred times
  # what a desktop measures, can fail it.
  latency:
    name: Quote-path latency
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev libxdo-dev pkg-config
      # The shell embeds the front end at compile time; the benchmark never
      # shows it, so a placeholder page stands in for a front-end build.
      - name: Placeholder front end
        run: mkdir -p "$FRONTEND/dist" && echo '<!doctype html>' > "$FRONTEND/dist/index.html"
      - name: Rust
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: latency
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Measure
        env:
          FANSIPAN_LATENCY_REPORT: ${{ runner.temp }}/latency.md
        run: cargo test -p fansipan-shell --release --locked --lib latency -- --ignored --nocapture --test-threads 1
      - name: Report
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/latency.md" ]; then
            { echo "## Quote-path latency ($(nproc) CPUs)"; echo; cat "$RUNNER_TEMP/latency.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi
