# Fansipan in a container, shown in the browser:
#
#   docker compose up --build
#   # open http://localhost:6080/vnc.html?autoconnect=true&resize=scale
#
# The terminal asks which simulated market to run, and remembers it. To skip
# the question: FANSIPAN_SANDBOX_MARKET=us (or vn) docker compose up
name: fansipan

services:
  fansipan:
    build: .
    image: fansipan:local
    init: true
    # WebKit's renderer uses shared memory; Docker's 64 MB default is too little.
    shm_size: 512m
    ports:
      # This machine only: the VNC session behind it has no password.
      - "127.0.0.1:6080:6080"
    environment:
      # Empty: the trader chooses at first launch.
      FANSIPAN_SANDBOX_MARKET: ${FANSIPAN_SANDBOX_MARKET:-}
      # real: the market's real trading hours. Anything else: a demo day
      # that runs every phase every 15 minutes.
      FANSIPAN_SANDBOX_CLOCK: ${FANSIPAN_SANDBOX_CLOCK:-demo}
      # How often the market moves, in milliseconds; a few for a busy feed.
      FANSIPAN_SANDBOX_BEAT_MS: ${FANSIPAN_SANDBOX_BEAT_MS:-500}
      # The chart's clock: TZ=Asia/Ho_Chi_Minh docker compose up
      TZ: ${TZ:-UTC}
    volumes:
      # Layouts, windows, link groups, and the chosen language.
      - fansipan-settings:/home/fansipan/.config

volumes:
  fansipan-settings:
